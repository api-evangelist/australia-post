apis:
- aid: australia-post:shipping-and-tracking
  name: Australia Post Shipping and Tracking API
  description: >-
    Enables eParcel and StarTrack contract customers to lodge orders, create and print shipping labels
    (including dangerous goods forms), generate order summaries, despatch parcels, estimate prices and
    international landed costs, and track parcel progress from source to destination through a single
    REST integration. Requires an active Australia Post or StarTrack billing account number; a sandbox
    test-bed environment is provided before going live.
  humanURL: https://auspost.com.au/integrate-shipping-and-tracking-apis
  baseURL: https://digitalapi.auspost.com.au
  tags:
  - Shipping
  - Labels
  - Tracking
  - Logistics
  - E-Commerce
  properties:
  - type: Documentation
    url: https://auspost.com.au/integrate-shipping-and-tracking-apis
  - type: GettingStarted
    url: https://auspost.com.au/developers/help-support/how-to-get-credentials/
  - type: APIReference
    url: https://developers.auspost.com.au/apis/shipping-and-tracking/reference
- aid: australia-post:postage-assessment-calculator
  name: Australia Post Postage Assessment Calculator API
  description: >-
    Lets businesses and developers embed a postage calculator into websites or applications to retrieve
    standard retail postage rates for domestic and international parcels and letters. Accepts weight,
    dimensions, origin, and destination to return eligible services with pricing. Uses HTTP GET requests
    returning JSON or XML; authentication via AUTH-KEY header. Free API key available via self-serve registration.
    Note — this API returns retail rates only; contract rates require the Shipping and Tracking API.
  humanURL: https://developers.auspost.com.au/apis/pac/
  baseURL: https://digitalapi.auspost.com.au
  tags:
  - Postage
  - Pricing
  - E-Commerce
  - Rating
