- aid: australia-post:delivery-choices
  name: Australia Post Delivery Choices API
  description: >-
    Allows customers to select preferred delivery options at checkout, including delivery speed, delivery
    or collection location, and specific day, date, and time of delivery. Supports parcel locker delivery,
    authority to leave, nominated safe place, and click-and-collect at Australia Post outlets. Access
    requires meeting eParcel contract minimum volumes.
  humanURL: https://developers.auspost.com.au/apis/dce/
  baseURL: https://digitalapi.auspost.com.au
